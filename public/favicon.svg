<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ibrahim Ismail">
	<!--
		The site's own motif: a prompt chevron and a block cursor — the two marks the build
		sequence and the command palette are built around, and a cursor is an I besides.

		Hand-drawn, and the same geometry scripts/favicon.py rasterises, so the vector and the
		.ico cannot drift apart.
	-->
	<rect width="64" height="64" rx="14" fill="#1b1e24" />
	<path
		d="M15 15 L31 32 L15 49"
		fill="none"
		stroke="#d7dae0"
		stroke-width="8"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<rect x="39" y="13" width="11" height="38" rx="2" fill="#61afef" />
</svg>
